[versions]
# Aligned with the MEGA android project (StudioProjects/android gradle/catalogs)
agp = "9.4.0"
coroutines = "1.11.0"
google-ksp = "2.3.9"
junit5 = "6.1.2"
kotlin = "2.4.0"
kotlinpoet = "2.3.0"
kotlinx-serialization = "1.11.0"
# dev.zacsweers.kctfork is the maintained fork of kotlin-compile-testing; 0.13.0 targets Kotlin 2.4.0 / KSP 2.3.9
kotlin-compile-testing = "0.13.0"
mockito-kotlin = "6.3.0"
mockito-inline = "5.2.0"
truth = "1.4.5"
jfrog = "6.0.4"
multiplatform-swift = "2.2.4"

[libraries]
google-ksp = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "google-ksp" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinpoet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { group = "com.squareup", name = "kotlinpoet-ksp", version.ref = "kotlinpoet" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

#Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
kotlin-compile-testing = { group = "dev.zacsweers.kctfork", name = "core", version.ref = "kotlin-compile-testing" }
kotlin-compile-testing-ksp = { group = "dev.zacsweers.kctfork", name = "ksp", version.ref = "kotlin-compile-testing" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito-inline" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[bundles]
junit5 = ["junit-jupiter-api", "junit-jupiter-engine", "junit-jupiter-params"]
mocking = ["mockito-kotlin", "mockito-inline", "truth"]
compile-testing = ["kotlin-compile-testing", "kotlin-compile-testing-ksp"]

[plugins]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
jfrog = { id = "com.jfrog.artifactory", version.ref = "jfrog" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "google-ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
multiplatform-swift = { id = "io.github.luca992.multiplatform-swiftpackage", version.ref = "multiplatform-swift" }
