#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#MPP
kotlin.mpp.enableCInteropCommonization=true

#KSP
# The generated events dir is also a commonMain source dir, which KSP2 does not exclude from its
# own inputs. Incremental runs then treat the generated files as new sources and delete them all,
# so the iOS framework (built in a second Gradle invocation on CI) ships without any events.
ksp.incremental=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
